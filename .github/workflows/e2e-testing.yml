name: End to End Testing

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Slimefun artifact name'
        required: true
        type: string

jobs:
  e2e-testing:
    name: End to End Testing
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      matrix:
        include:
          - mcVersion: '1.17.1'
            javaVersion: '21'
          - mcVersion: '1.18.2'
            javaVersion: '21'
          - mcVersion: '1.19.4'
            javaVersion: '21'
          - mcVersion: '1.20.6'
            javaVersion: '21'
          - mcVersion: '1.21.4'
            javaVersion: '21'
          - mcVersion: '1.21.8'
            javaVersion: '21'
          - mcVersion: 'latest'
            javaVersion: '25'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.javaVersion }}
          java-package: jdk
          architecture: x64

      - name: Setup server
        run: |
          echo 'eula=true' > eula.txt
          mkdir plugins

      - name: Download ${{ matrix.mcVersion }} Paper
        shell: bash
        run: |
          VERSION="${{ matrix.mcVersion }}"
          USER_AGENT="Slimefun4-CI/1.0 (https://github.com/SlimefunGuguProject/Slimefun4)"
          if [ "$VERSION" == "latest" ]; then
            VERSIONS=$(curl --fail --silent --show-error --user-agent "$USER_AGENT" \
              https://fill.papermc.io/v3/projects/paper \
              | jq -er '.versions | to_entries[] | .value[]' | sort -V -r)
          else
            VERSIONS="$VERSION"
          fi

          PAPER_BUILD=null
          for VERSION in $VERSIONS; do
            BUILDS=$(curl --fail --silent --show-error --user-agent "$USER_AGENT" \
              "https://fill.papermc.io/v3/projects/paper/versions/$VERSION/builds")
            PAPER_BUILD=$(echo "$BUILDS" \
              | jq -c 'first(.[] | select(.channel == "STABLE")) // null')
            if [ "$PAPER_BUILD" != "null" ]; then
              break
            fi
            echo "No stable Paper build for $VERSION"
          done

          PAPER_URL=$(echo "$PAPER_BUILD" \
            | jq -er '.downloads["server:default"].url
              // error("No stable Paper build found")')
          PAPER_SHA256=$(echo "$PAPER_BUILD" \
            | jq -er '.downloads["server:default"].checksums.sha256
              // error("No checksum found for stable Paper build")')

          echo "Downloading Paper $VERSION from $PAPER_URL"
          curl --fail --location --show-error --user-agent "$USER_AGENT" \
            --output paper.jar \
            "$PAPER_URL"
          echo "$PAPER_SHA256  paper.jar" | sha256sum --check --strict

      - name: Download Slimefun
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: plugins/

      - name: Download e2e-tester
        run: |
          curl -o e2e-tester.jar https://builds.guizhanss.com/api/download/ybw0014/Slimefun-e2e-tester/main/latest
          mv e2e-tester.jar plugins/e2e-tester.jar

      - name: Run server
        run: |
          java -jar paper.jar --nogui
